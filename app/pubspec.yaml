name: vpnonline_app
description: VPN onLine — клиентское приложение (Android/iOS/Windows/macOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # GlobalMaterialLocalizations и компания для main.dart: переключает язык
  # системных виджетов Material (кнопки "ОК"/"Отмена" в диалогах, формат дат)
  # вместе с языком из "Настройки" -> "Язык". Часть SDK, версии не имеет.
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  google_fonts: ^6.2.1
  # Флаг "первый запуск" для онбординга и открытие payment_url в системном
  # браузере при покупке.
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  # Хранилище токена сессии: Keychain на iOS/macOS, Keystore на Android,
  # Credential Manager на Windows. В SharedPreferences токену не место — это
  # обычный файл на диске, а не защищённое хранилище.
  flutter_secure_storage: ^9.2.2
  # Ядро туннеля — то же sing-box, что в Hiddify. Лицензия пакета GPL-3.0.
  # Сегодня поддерживается только Android (iOS/macOS в разработке,
  # Windows/Linux в планах) — на Windows туннель поднимает отдельный процесс
  # sing-box.exe, см. lib/services/singbox_runtime_windows.dart.
  # Без платформенной настройки (App Group + Network Extension на iOS/macOS
  # через Xcode, sing-box.exe на Windows — см. app/NATIVE_SETUP.md) одно лишь
  # добавление пакета VPN не включит.
  # Ядро sing-box из форка hiddify/hiddify-sing-box: оно, в отличие от
  # апстримного, умеет транспорт XHTTP (он же splithttp) и умеет рвать на
  # куски собственное TLS-рукопожатие к серверу — то самое, по которому DPI
  # решает, пропускать соединение. Собрано под те же четыре архитектуры, что и
  # штатное (см. .github/workflows/build-xhttp-core.yml), 79 МБ против 91.
  #
  # Ветка ccurecc_singbox_xhttp собрана поверх ccurecc_singbox_dns_vpndns,
  # то есть несёт и исправление публикации DNS на VPN-интерфейсе. Отличие от
  # штатной ветки плагина — ровно два файла: libbox.aar и SingboxVPNService.kt.
  #
  # Откат на штатное ядро — поменять ref на ccurecc_singbox_dns и выполнить
  # flutter pub get. Код приложения при этом не меняется: и XHTTP, и
  # фрагментацию он включает только после того, как ядро само подтвердит их
  # поддержку (см. app/XHTTP_CORE.md).
  flutter_singbox_client:
    git:
      url: https://github.com/Ghosts1996/cf.git
      ref: ccurecc_singbox_xhttp
      path: app/third_party/flutter_singbox_client
  # Список установленных приложений для экрана split-tunnel. API 2.0.0+ —
  # именованные аргументы (excludeSystemApps/excludeNonLaunchableApps).
  # Только Android: на остальных платформах пакет возвращает пустой список,
  # экран обрабатывает это отдельной веткой.
  installed_apps: ^2.0.0
  # Кнопка "Открыть системные настройки VPN" рядом с Kill Switch —
  # tunnel_service.dart::openSystemVpnSettingsHint().
  app_settings: ^5.1.1
  # Тумблер "Умное подключение на публичном Wi-Fi": приложению нужно знать о
  # смене сети (Wi-Fi, мобильная, нет сети) — см. connect_screen.dart.
  connectivity_plus: ^6.1.0
  # Значок в системном трее Windows. window_manager перехватывает закрытие
  # окна крестиком и прячет окно вместо выхода — иначе вместе с процессом
  # пришлось бы останавливать и туннель (на Windows это отдельный процесс
  # sing-box.exe). tray_manager рисует сам значок и меню. Оба только для
  # Windows/macOS/Linux, на Android и iOS tray_service.dart их не трогает.
  window_manager: ^0.4.3
  tray_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Генерация иконок для всех платформ из одного PNG (assets/icon/ и секция
  # flutter_launcher_icons ниже). Запускается командой
  # `dart run flutter_launcher_icons` — в CI это отдельный шаг, см.
  # .github/workflows/build-android.yml.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/tray/

# image_path — полная иконка (фигура и фон) для iOS/macOS/Windows/web, где
# адаптивных иконок нет. Для Android собирается adaptive icon: непрозрачный
# foreground (щит без фона) поверх сплошного фонового цвета бренда, иначе
# контур щита обрезают маски формы разных лаунчеров.
flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#05030A"
    theme_color: "#B026FF"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#05030A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true