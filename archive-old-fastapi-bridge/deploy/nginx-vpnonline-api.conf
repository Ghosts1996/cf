# nginx reverse-proxy для backend'а — вынеси в /etc/nginx/sites-available/,
# создай симлинк в sites-enabled, проверь `nginx -t`, перезапусти nginx.
# HTTPS/сертификат сюда не входит — используй certbot (Let's Encrypt) отдельно,
# это стандартный шаг, не специфичный для этого проекта.

server {
    listen 443 ssl http2;
    server_name api.vpnonline.su;

    # ssl_certificate / ssl_certificate_key — подставь свои (certbot их создаст сам)
    ssl_certificate     /etc/letsencrypt/live/api.vpnonline.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vpnonline.su/privkey.pem;

    # Базовый rate-limit на уровне nginx — дополняет (не заменяет) rate-limit
    # внутри auth.py. Определи зону один раз в http{} блоке nginx.conf:
    #   limit_req_zone $binary_remote_addr zone=vpnonline_api:10m rate=20r/s;
    limit_req zone=vpnonline_api burst=40 nodelay;

    location /v1/webhooks/ {
        # Вебхуки платёжных провайдеров дергаются НЕ пользователем, а сервером
        # YooKassa/CryptoBot — ограничь по их официальным IP-диапазонам,
        # если провайдер их публикует, дополнительно к проверке подписи в коде.
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.vpnonline.su;
    return 301 https://$host$request_uri;
}
