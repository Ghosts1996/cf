name: Облегчённые APK для Telegram-бота

# Добавляет к УЖЕ опубликованной сборке APK под arm64 и 32-бит (по ~30–43 МБ),
# чтобы бот мог присылать приложение файлом. Новой сборки и плашки «Обновить» не будет.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например build-385'
        required: true
  # Заявка файлом: коммит .github/slim-request.txt (внутри — тег) запускает облегчение этой сборки.
  push:
    paths:
      - '.github/slim-request.txt'

permissions:
  contents: write

jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Какую сборку облегчить
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$(tr -d '[:space:]' < .github/slim-request.txt)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Сборка: $TAG"
      - name: Скачать APK релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ steps.tag.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern app-release.apk --dir out
      - name: Облегчить и подписать тем же ключом
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
          bash .github/workflows/scripts/slim_apk.sh out/app-release.apk out "$RUNNER_TEMP/ks.jks"
          rm -f "$RUNNER_TEMP/ks.jks"
      - name: Добавить файлы в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" out/app-arm64-v8a-release.apk out/app-armeabi-v7a-release.apk --repo "$GITHUB_REPOSITORY" --clobber
