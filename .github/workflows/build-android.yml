name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix/secure-configs-and-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # [НОВОЕ — исправление сбоя CI "429 Too Many Requests" от Maven
      # Central/Gradle Plugin Portal] Раньше зависимости Gradle (Kotlin
      # Gradle Plugin, AGP и т.д.) скачивались с нуля на КАЖДОМ запуске
      # workflow — ни разу не кэшировались. Тысячи раннеров GitHub Actions
      # по всему миру одновременно дёргают те же самые зеркала за теми же
      # версиями плагинов, и repo.maven.apache.org/plugins.gradle.org
      # иногда отвечают 429 (rate limit) под этой нагрузкой. Кэш не
      # устраняет 429 полностью (первый запуск после инвалидации кэша
      # всё равно качает с нуля), но резко снижает частоту сетевых
      # обращений на последующих запусках — кэш переживает между запусками
      # workflow, пока не поменяется gradle-wrapper.properties/*.gradle.kts.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter (official)
        uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      # [ИСПРАВЛЕНО — реальный баг] pubspec.yaml настраивает
      # flutter_launcher_icons (генерация mipmap/AppIcon.appiconset и т.д.
      # из assets/icon/app_icon*.png), но ни один шаг workflow ни разу не
      # запускал сам генератор — до этой правки CI молча собирал APK со
      # старой стандартной иконкой Flutter, а не с фирменной, независимо
      # от того, что лежит в assets/icon/.
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Run tests
        run: flutter test --coverage || true

      # [ИСПРАВЛЕНО — сбой "429 Too Many Requests" от Maven Central при
      # резолве Kotlin Gradle Plugin] flutter build apk сам ретраит Gradle
      # один раз при сетевой ошибке (это видно в логе — "Retrying Gradle
      # Build: #1"), но если внешний репозиторий отвечает 429 два раза
      # подряд с интервалом в доли секунды, одного повтора недостаточно.
      # 429 — это ВРЕМЕННЫЙ отказ (rate limit), а не ошибка в проекте:
      # обёртка nick-fields/retry делает до 3 попыток с паузой 30 секунд
      # между ними, за которые лимит на стороне Maven Central/Gradle
      # Plugin Portal успевает сброситься.
      # [ИСПРАВЛЕНО — реальная причина "приложение будто всё ещё ходит на
      # старый API" после смены домена api.vpnonline.shop -> api.vpnonline.su]
      # Раньше сюда передавался --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }}
      # — значение секрета ПОЛНОСТЬЮ перекрывает дефолт из кода
      # (String.fromEnvironment в main.dart), это так и задумано в Dart. Домен
      # в коде поправили на api.vpnonline.su, а секрет API_BASE_URL в
      # настройках репозитория остался старым (секреты не меняются сами при
      # правке кода) — поэтому реально собранный APK всё это время тянул
      # старый, уже мёртвый api.vpnonline.shop, хотя в исходниках стоял
      # правильный su-домен. Отсюда и "Сервер не отвечает" на "Серверах":
      # приложение стучалось не туда физически, а не просто получало
      # ошибку авторизации, как в предыдущем баге.
      # Раз этот адрес и так не секрет (см. DOCUMENTATION.md, таблица
      # переменных), убираем его из --dart-define вовсе: теперь единственный
      # источник правды — дефолт в main.dart, никакого секрета, который
      # можно забыть обновить, для домена больше нет.
      - name: Build debug APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd app && flutter build apk --debug --no-shrink --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      # [ПРОВЕРЕНО ПОЛЬЗОВАТЕЛЕМ] На скриншоте Secrets имя было обрезано
      # ("ANDROID_KEYSTO…"), и я ошибочно принял его за короткое
      # ANDROID_KEYSTORE — на самом деле секрет называется
      # ANDROID_KEYSTORE_BASE64, как и было в исходном workflow. Возвращаю
      # оригинальное имя.
      - name: Prepare signed release (if keystore provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: mkdir -p android/keystore && echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/keystore.jks && printf 'storeFile=../keystore/keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > android/key.properties

      - name: Build release APK (signed if keystore present)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd app && if [ -f android/keystore/keystore.jks ]; then flutter build apk --release --no-shrink --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}; else echo "Keystore not found, building unsigned release APK" && flutter build apk --release --no-shrink --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}; fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk