name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix/secure-configs-and-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          sudo docker image prune --all --force || true
          df -h

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Кэш Gradle: без него зависимости (Kotlin Gradle Plugin, AGP) качаются с
      # нуля на каждом запуске, а под нагрузкой repo.maven.apache.org и
      # plugins.gradle.org отвечают 429. Кэш не убирает 429 полностью — первый
      # запуск после инвалидации всё равно качает всё, — но резко снижает число
      # сетевых обращений.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle*', 'app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Flutter (official)
        uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      # pubspec.yaml настраивает flutter_launcher_icons, но генератор нужно
      # запустить явно: иначе APK собирается со стандартной иконкой Flutter.
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Run tests
        run: flutter test --coverage || true

      # flutter build apk сам ретраит Gradle один раз при сетевой ошибке, но
      # при двух 429 подряд этого мало. 429 — временный отказ, а не ошибка
      # проекта, поэтому обёртка даёт до 3 попыток с паузой 30 секунд.
      #
      # Адрес API через --dart-define здесь не передаётся: значение секрета
      # полностью перекрывает дефолт из main.dart, и забытый в настройках
      # репозитория старый домен уводил бы сборку на мёртвый адрес. Адрес не
      # секрет (см. DOCUMENTATION.md), так что единственный источник правды —
      # дефолт в main.dart.
      - name: Build debug APK
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd app && flutter build apk --debug --no-shrink --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

      - name: Prepare signed release (if keystore provided)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: mkdir -p android/keystore && echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keystore/keystore.jks && printf 'storeFile=../keystore/keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" "${{ secrets.ANDROID_KEY_ALIAS }}" "${{ secrets.ANDROID_KEY_PASSWORD }}" > android/key.properties

      - name: Build release APK (signed if keystore present)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 30
          command: cd app && if [ -f android/keystore/keystore.jks ]; then flutter build apk --release --no-shrink --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}; else echo "Keystore not found, building unsigned release APK" && flutter build apk --release --no-shrink --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}; fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk