name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: 🧠 AI Code Optimization and Bug Fix (DeepSeek-R1)
        run: |
          echo "🚀 Безопасно кодируем файл и отправляем запрос на AITUNNEL..."
          
          # Читаем код и кодируем его в Base64 для 100% защиты от багов в JSON
          if [ -f "app/lib/services/tunnel_service.dart" ]; then
            TUNNEL_CODE_B64=\$(cat app/lib/services/tunnel_service.dart | base64 -w 0)
          else
            TUNNEL_CODE_B64=\$(echo -n "Файл отсутствует, создай с нуля" | base64 -w 0)
          fi

          # Чистим URL из секретов
          CLEAN_URL=\$(echo "\({{ secrets.AITUNNEL_BASE_URL }}" \vert{} sed 's/[/]*\)//')
          
          # Отправляем запрос, передавая промпт и закодированный файл
          RESPONSE=(curl -s -X POST "CLEAN_URL/chat/completions" \
            -H "Authorization: Bearer \${{ secrets.AITUNNEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"deepseek-r1\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"Ты элитный Flutter разработчик. Исправь код sing-box VLESS Reality, настрой DNS, маршрутизацию и почини вылеты на Android 14+. Твой ответ должен состоять СТРОГО только из чистого кода Dart. Запрещено использовать markdown-теги вроде \`\`\`dart или \`\`\`, пиши только сырой код файла.\"},
                {\"role\": \"user\", \"content\": \"Задача:  github.event.inputs.prompt . Базовый код текущего файла в Base64 (декодируй перед анализом): TUNNEL_CODE_B64\"}
              ]
            }")

          # Извлекаем контент ответа
          NEW_CODE=(echo "RESPONSE" | jq -r '.choices[0].message.content // .choices.message.content')

          if [ "\(NEW_CODE" == "null" ] \vert{}\vert{} [ -z "\)NEW_CODE" ]; then
            echo "❌ Ошибка: Сервер вернул пустой ответ."
            echo "Ответ сервера: \$RESPONSE"
            exit 1
          fi

          # Очищаем от случайных markdown-тегов, если ИИ их все-таки добавил
          CLEAN_CODE=(echo "NEW_CODE" | sed '/^```/d')

          echo "✅ Код успешно сгенерирован моделью DeepSeek-R1!"
          
          # Записываем исправленный код обратно в проект
          mkdir -p app/lib/services
          echo "$CLEAN_CODE" > app/lib/services/tunnel_service.dart
          
          # Безопасно обновляем манифест для Android 14+
          MANIFEST_PATH="app/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<service/ s/>/ android:foregroundServiceType=\"vpn\">/' "$MANIFEST_PATH"
            echo "✅ AndroidManifest.xml успешно пропатчен!"
          fi

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super AI Safe Fix: ${{ github.event.inputs.prompt }}" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: app/build/outputs/flutter-apk/*.apk
