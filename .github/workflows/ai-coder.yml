name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Что нужно исправить или улучшить в коде?'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm i -g cline

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🧠 ШАГ 1: DeepSeek-R1 — Глубокий аудит сети (Без изменения файлов)
        run: |
          echo "🔍 DeepSeek-R1 ищет скрытую причину блокировки трафика и нулевой отдачи..."
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid deepseek-r1 --cwd . \
          "Проанализируй код VPN-сервиса. Проблема: ${{ github.event.inputs.task_prompt }}. Найди баг в роутинге, DNS или туннелировании интерфейса. Напиши подробный технический отчет об уязвимости и сохрани его в файл .ai_bug_report.md в корне проекта. Файлы кода НЕ изменяй."

      - name: 🛡 ШАГ 2: Claude Fable 5 — Архитектурный контроль и Безопасность
        run: |
          echo "📐 Claude Fable 5 проверяет риски и планирует безопасную интеграцию..."
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-fable-5 --cwd . \
          "Прочитай файл .ai_bug_report.md. Сопоставь его с архитектурой проекта. Составь пошаговый безопасный план изменения кода, который решит проблему и гарантированно НЕ сломает интерфейс, таймеры и другие модули приложения. Запиши инструкции в файл .ai_fix_plan.md. Строго запрещено трогать build.gradle и AndroidManifest.xml."

      - name: ⚡ ШАГ 3: Claude Sonnet — Аккуратное внедрение правок
        run: |
          echo "✍️ Claude Sonnet выполняет точечную перезапись файлов по инструкциям..."
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-3-5-sonnet --cwd . \
          "Изучи файлы .ai_bug_report.md and .ai_fix_plan.md. Аккуратно примени изменения к исходному коду проекта (Kotlin/Java), строго следуя плану безопасности от Claude Fable 5. Не удаляй существующую важную логику."

      - name: 👑 ШАГ 4: Claude Opus — Экспертный Code Review и Оптимизация
        run: |
          echo "🧐 Подключаем Claude Opus для финального контроля качества и исправления скрытых багов..."
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-3-opus --cwd . \
          "Внимательно изучи изменения, которые только что внес Claude Sonnet для решения проблемы: ${{ github.event.inputs.task_prompt }}. Проверь код на утечки памяти, зависания потоков, баги с таймером или сессиями. Если найдешь недочеты — исправь их. После завершения удали временные файлы .ai_bug_report.md и .ai_fix_plan.md."

      - name: 🚦 Авто-проверка проекта (Синтаксический контроль)
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          echo "Проверяем корректность кода перед коммитом..."
          ./gradlew compileDebugSources --no-daemon

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super Multi-AI Safe Fix: ${{ github.event.inputs.task_prompt }}" || echo "No changes to commit"
          git push

      - name: Build Android APK (Auto-detect folder)
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Ошибка: Файл gradlew не найден!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          echo "🚀 Запуск компиляции финального APK..."
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
