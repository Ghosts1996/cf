name: Claude Fable Autonomous Builder
on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Что нужно исправить или улучшить в коде?'
        required: true

# Права на запись кода в репозиторий
permissions:
  contents: write
  actions: write

jobs:
  ai-agent-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm i -g cline

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Cline Agent Core
        run: |
          # Запуск агента, который правит код прямо в текущей директории
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-fable-5 --cwd . "${{ github.event.inputs.task_prompt }}"

      - name: Commit and Push changes
        continue-on-error: true # Если гит выдаст ошибку, скрипт НЕ упадет, а пойдет собирать APK
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Claude Fable Auto-fix: ${{ github.event.inputs.task_prompt }}" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          # Даем права на запуск сборщика и собираем отладочный APK
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: app/build/outputs/apk/debug/app-debug.apk
