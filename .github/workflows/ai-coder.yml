name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Что нужно исправить или улучшить в коде?'
        required: true
      model:
        description: 'Какую модель использовать?'
        required: true
        default: 'deepseek-r1'

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: 🧠 AI Whole-Project Code Fix (Python Engine)
        id: ai_optimize
        env:
          USER_PROMPT: \${{ github.event.inputs.prompt }}
          MODEL_CHOICE: \${{ github.event.inputs.model }}
          AITUNNEL_BASE_URL: \${{ secrets.AITUNNEL_BASE_URL }}
          AITUNNEL_API_KEY: \${{ secrets.AITUNNEL_API_KEY }}
        run: |
          python3 -c "
          import os, sys, json, urllib.request
          prompt = os.getenv('USER_PROMPT', '').strip()
          url = os.getenv('AITUNNEL_BASE_URL', '').rstrip('/')
          api_key = os.getenv('AITUNNEL_API_KEY', '')
          model = os.getenv('MODEL_CHOICE', 'deepseek-r1')
          print('🔍 Python собирает файлы Flutter-приложения...')
          project_bundle = []
          for root, dirs, files in os.walk('app'):
           if 'build' in root or '.dart_tool' in root: continue
           for file in files:
            if file.endswith(('.dart', '.xml', '.yaml')):
             fp = os.path.join(root, file)
             try:
              with open(fp, 'r', encoding='utf-8') as f: content = f.read()
              project_bundle.append(f'=== START FILE: {fp} ===\n{content}\n=== END FILE ===\n')
             except: pass
          bundle_text = '\n'.join(project_bundle)
          print(f'📦 Успешно упаковано файлов: {len(project_bundle)}')
          sys_prompt = 'Ты старший инженер Flutter/Android. Тебе дан ПОЛНЫЙ доступ на чтение и запись всех файлов репозитория. Изучи переданный код. Исправь ошибку Connection failed под формат ключей Hiddify (настройки DNS, маршруты sing-box, MethodChannel vpnvless/fallback). Добавь в меню Мои ключи выбор активного ключа ( shared_preferences). Защити приложение от вылетов на Android 14+ (foregroundServiceType=vpn в AndroidManifest.xml). Можешь изменять и перезаписывать ЛЮБЫЕ файлы проекта. Твой ответ должен содержать только блоки измененных файлов в строгом формате разметки: [FILE: путь/к/файлу] тут код [END_FILE]. Не используй маркдаун теги ```dart.'
          payload = {'model': model, 'messages': [{'role': 'system', 'content': sys_prompt}, {'role': 'user', 'content': f'Задача: {prompt}\n\nКод проекта:\n\n{bundle_text}'}], 'max_tokens': 32000}
          print('📡 Отправляем запрос на шлюз AITUNNEL...')
          req = urllib.request.Request(f'{url}/chat/completions', data=json.dumps(payload).encode('utf-8'), headers={'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'}, method='POST')
          try:
           with urllib.request.urlopen(req, timeout=600) as response:
            res_data = json.loads(response.read().decode('utf-8'))
            ai_text = res_data['choices']['message']['content']
            print('✅ Запрос выполнен успешно! Разбираем структуру ответа ИИ...')
            if '<think>' in ai_text: ai_text = ai_text.split('</think>')[-1]
            lines = ai_text.split('\n')
            current_file = None
            file_content = []
            for line in lines:
             if '[FILE:' in line:
              current_file = line.split('[FILE:')[-1].split(']')[0].strip()
              file_content = []
              print(f'🛠 ИИ принял решение обновить файл: {current_file}')
             elif '[END_FILE]' in line and current_file:
              os.makedirs(os.path.dirname(current_file), exist_ok=True)
              with open(current_file, 'w', encoding='utf-8') as out: out.write('\n'.join(file_content).strip('`').strip())
              print(f'✅ Файл {current_file} успешно изменен и сохранен в репозиторий!')
              current_file = None
             elif current_file:
              file_content.append(line)
            if not ai_text.contains('[FILE:'):
             print('⚠️ ИИ прислал плоский код без разметки. Записываем напрямую в tunnel_service.dart...')
             clean_code = ai_text.replace('```dart', '').replace('```', '').strip()
             os.makedirs('app/lib/services', exist_ok=True)
             with open('app/lib/services/tunnel_service.dart', 'w', encoding='utf-8') as out: out.write(clean_code)
          except Exception as e:
           print(f'❌ Ошибка выполнения пайплайна: {e}')
           sys.exit(1)
          "

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super AI Safe Fix: Autonomous Multi-File Project Update" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: app/build/outputs/flutter-apk/*.apk
