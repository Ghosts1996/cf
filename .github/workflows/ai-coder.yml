name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm i -g cline

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 🧠 ШАГ 1: DeepSeek-R1 — Глубокий аудит сети
        run: |
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid deepseek-r1 --cwd . "Проанализируй код VPN-приложения. Проблема: при нажатии кнопки подключиться появляется значок VPN в шторке, но интернет не работает, таймер выдает 0 и трафик 0. Найди причину багов и составь технический план исправления для другой нейросети. Сохрани его в файл .ai_bug_report.md."

      - name: 🛡 ШАГ 2: Claude Fable 5 — Архитектурный контроль
        run: |
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-fable-5 --cwd . "Прочитай файл .ai_bug_report.md. Составь пошаговый безопасный план изменения кода, который решит проблему и гарантированно не сломает интерфейс и другие модули приложения. Запиши инструкции в файл .ai_fix_plan.md."

      - name: ⚡ ШАГ 3: Claude Sonnet — Внедрение правок
        run: |
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-3-5-sonnet --cwd . "Изучи файлы .ai_bug_report.md и .ai_fix_plan.md. Аккуратно примени изменения к исходному коду проекта (Kotlin/Java), строго следуя плану безопасности. Исправь баг с интернетом и таймером."

      - name: 👑 ШАГ 4: Claude Opus — Экспертный Code Review
        run: |
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-3-opus --cwd . "Внимательно изучи изменения, которые внес прошлый ИИ. Проверь код на утечки памяти, зависания потоков или баги с сессиями VPN. Если найдешь недочеты — исправь их. После завершения удали временные файлы .ai_bug_report.md и .ai_fix_plan.md."

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super Multi-AI Safe Fix: VPN Internet & Timer Bug" || echo "No changes to commit"
          git push

      - name: Build Android APK (Fallback to System Gradle)
        run: |
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          if [ -n "$GRADLEW_PATH" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW_PATH")
            cd "$PROJECT_DIR"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            sudo apt-get update && sudo apt-get install -y gradle
            BUILD_PATH=$(find . -name build.gradle -print -quit)
            if [ -z "$BUILD_PATH" ]; then
              echo "❌ Ошибка: Файл build.gradle не найден!"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$BUILD_PATH")
            cd "$PROJECT_DIR"
            gradle assembleDebug
          fi

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
