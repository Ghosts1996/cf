name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: 🚀 Глубокий аудит и добавление фичи (Harness via npx + DeepSeek-R1)
        env:
          OPENAI_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
          OPENAI_BASE_URL: https://aitunnel.ru
        run: |
          echo "🤖 Запускаем Harness через npx для полного анализа структуры проекта..."
          
          # Используем npx для обхода ошибки command not found. Пакет скачается и запустится сам.
          npx harness-ai --provider openai --model deepseek-r1 --cwd . "
          Проведи полный аудит всех файлов Flutter-приложения в папке app/. 
          
          Выполни три критические задачи, строго следуя архитектуре проекта:
          
          1. Исправь ошибку 'Connection failed. Please check your configuration'. Изучи модуль конфигурации ядра sing-box и файл tunnel_service.dart. Нейросеть должна полностью разобраться, как приложение считывает, расшифровывает и парсит ключи протокола VLESS Reality. Настрой идеальный шаблонизатор JSON-конфига для sing-box, пропиши рабочие DNS и маршруты трафика, чтобы ядро успешно поднимало туннель без вылетов.
          
          2. Добавь новую функцию в интерфейс: найди экран меню 'Мои ключи' (ориентируйся по названиям файлов в app/lib/screens/ или app/lib/pages/). Добавь туда текстовое поле ввода (TextField) для ручного добавления ключа VLESS Reality (vless://...) или URL-ссылки подписки 3x-ui, и кнопку 'Применить ключ'. Напиши логику, чтобы введенный пользователем ключ автоматически сохранялся в локальную память (пакет shared_preferences или secure_storage, который уже используется в проекте) и сразу передавался в tunnel_service.dart для подключения.
          
          3. Защити приложение от вылетов на других смартфонах: проверь AndroidManifest.xml и конфигурации сборки Gradle. Убедись, что для Android 14+ прописан foregroundServiceType='vpn' в свойствах VpnService.
          
          Действуй аккуратно. Пиши чистый, оптимизированный Dart-код. Строго запрещено удалять существующие рабочие функции и ломать дизайн главного экрана.
          "

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Harness Auto-Fix: VLESS Core & Manual Key Feature" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: app/build/outputs/flutter-apk/*.apk
