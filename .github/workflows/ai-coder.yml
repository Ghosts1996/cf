name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Что нужно исправить или улучшить в коде?'
        required: true
      model:
        description: 'Какую модель использовать?'
        required: true
        default: 'deepseek-r1'

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          set -uo pipefail
          cd app
          flutter pub get

      - name: 🧠 AI Whole-Project Code Fix
        id: ai_optimize
        env:
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          MODEL_CHOICE: ${{ github.event.inputs.model }}
          AITUNNEL_BASE_URL: ${{ secrets.AITUNNEL_BASE_URL }}
          AITUNNEL_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
        run: |
          set -uo pipefail

          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          PROMPT_TRIMMED="$(trim "$USER_PROMPT")"
          PROMPT_LOWER="$(printf '%s' "$PROMPT_TRIMMED" | tr '[:upper:]' '[:lower:]')"

          echo "🔍 Собираем список файлов проекта..."
          mapfile -t PROJECT_FILES < <(find app -type f -name "*.dart" -o -name "*.xml" -o -name "*.yaml" -o -name "*.kt" -o -name "*.java")

          if [ "$PROMPT_LOWER" == "test" ]; then
            echo "🧪 ТЕСТОВЫЙ РЕЖИМ: Пропускаем запрос к ИИ."
            exit 0
          fi

          PROJECT_BUNDLE_FILE="$RUNNER_TEMP/project_bundle.txt"
          : > "$PROJECT_BUNDLE_FILE"
          for f in "${PROJECT_FILES[@]}"; do
            if [ -f "$f" ]; then
              printf '=== FILE: %s ===\n' "$f" >> "$PROJECT_BUNDLE_FILE"
              cat "$f" >> "$PROJECT_BUNDLE_FILE"
              printf '\n=== END FILE ===\n\n' >> "$PROJECT_BUNDLE_FILE"
            fi
          done

          SYSTEM_PROMPT="Ты старший Flutter/Android инженер, работающий с VPN-клиентом на sing-box (VLESS Reality). Сделай аудит проекта. Задача 1: Исправь ошибку Connection failed под формат ключей Hiddify (извлеки параметры маскировки трафика, DNS, http-опции и примени их в JSON-конфиге sing-box). Задача 2: Добавь в меню 'Мои ключи' функцию выбора активного ключа (с сохранением в shared_preferences), чтобы именно выбранный профиль передавался в ядро sing-box. Ответ верни строго в формате JSON с двумя полями: 'tunnel_code' (код исправленного tunnel_service.dart) и 'keys_code' (код экрана ключей с выбором профиля). Запрещено использовать markdown-теги ```dart."

          USER_CONTENT_FILE="\$RUNNER_TEMP/user_content.txt"
          {
            printf 'Задача: %s\n\n' "\$USER_PROMPT"
            printf 'Исходный код проекта:\n\n'
            cat "\$PROJECT_BUNDLE_FILE"
          } > "\$USER_CONTENT_FILE"

          CLEAN_URL="\${AITUNNEL_BASE_URL%/}"
          PAYLOAD_FILE="\$RUNNER_TEMP/payload.json"

          jq -n \
            --arg model "\$MODEL_CHOICE" \
            --arg sys "\$SYSTEM_PROMPT" \
            --rawfile usr "\$USER_CONTENT_FILE" \
            --argjson max_tokens 32000 \
            '{model: \(model, messages: [{role: "system", content: \)sys}, {role: "user", content: \(usr}], max_tokens:\)max_tokens}' \
            > "\$PAYLOAD_FILE"

          RESPONSE_FILE="\$RUNNER_TEMP/response.json"
          
          HTTP_CODE=(curl -sS --max-time 600 --retry 2 --retry-delay 5 -X POST "CLEAN_URL/chat/completions" \
            -H "Authorization: Bearer \$AITUNNEL_API_KEY" \
            -H "Content-Type: application/json" \
            -d @"\$PAYLOAD_FILE" \
            -o "\$RESPONSE_FILE" \
            -w '%{http_code}')

          if [ "\$HTTP_CODE" -ge 400 ]; then
            echo "❌ Сервер вернул ошибку HTTP \$HTTP_CODE"
            cat "\$RESPONSE_FILE"
            exit 1
          fi

          echo "✅ Запрос к API выполнен успешно! Начинаем физическую перезапись файлов..."

          # Физически извлекаем сгенерированный код из ответа ИИ
          AI_CONTENT=\((jq -r '.choices[0].message.content // empty' "\)RESPONSE_FILE")
          
          # Очищаем от мыслительного блока <think>...</think>, если используется deepseek-r1
          CLEAN_CONTENT=(echo "AI_CONTENT" | sed -e 's/<think>.*<\/think>//g')

          # Пробуем распарсить JSON поля, если ИИ вернул структурированный ответ
          NEW_TUNNEL=(echo "CLEAN_CONTENT" | jq -r '.tunnel_code // empty' 2>/dev/null || true)
          NEW_KEYS=(echo "CLEAN_CONTENT" | jq -r '.keys_code // empty' 2>/dev/null || true)

          # Если ИИ выдал просто сырой код без JSON-структуры, пишем его в tunnel_service.dart
          if [ -z "\$NEW_TUNNEL" ]; then
            NEW_TUNNEL=(echo "CLEAN_CONTENT" | sed '/^```/d')
          fi

          # Перезаписываем файлы в репозитории
          mkdir -p app/lib/services
          echo "$NEW_TUNNEL" > app/lib/services/tunnel_service.dart
          echo "✅ Файл tunnel_service.dart успешно перезаписан новым сетевым кодом sing-box!"

          # Ищем и обновляем экран ключей
          KEYS_FILE=$(find app/lib/ -name "*key*.dart" -print -quit || true)
          if [ -n "$NEW_KEYS" ] && [ "$NEW_KEYS" != "null" ] && [ -n "$KEYS_FILE" ]; then
            echo "$NEW_KEYS" > "$KEYS_FILE"
            echo "✅ Экран ключей ($KEYS_FILE) успешно обновлен: добавлен выбор активного профиля!"
          fi

          # Прописываем поддержку фонового VPN-сервиса для Android 14+
          MANIFEST_PATH="app/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<service/ s/>/ android:foregroundServiceType=\"vpn\">/' "$MANIFEST_PATH"
            echo "✅ AndroidManifest.xml успешно пропатчен!"
          fi

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super AI Safe Fix: VLESS Reality Hiddify & Active Key Selector" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: app/build/outputs/flutter-apk/*.apk
