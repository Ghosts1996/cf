name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm i -g cline

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: ШАГ 1 DeepSeek-R1
        env:
          CLINE_API_PROVIDER: openai-compatible
          CLINE_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
          CLINE_BASE_URL: ${{ secrets.AITUNNEL_BASE_URL }}
          CLINE_MODEL_ID: deepseek-r1
        run: |
          # Авторизация подхватывается из env-переменных, заведенных на твои секреты
          cline --cwd . "Проанализируй код приложения в папке app/. Проблема пользователя: ${{ github.event.inputs.prompt }}. Найди баг в tunnel_service.dart, роутинге, DNS или туннелировании ядра sing-box. Напиши технический отчет об ошибке в файл .ai_bug_report.md."

      - name: ШАГ 2 Claude Fable 5
        env:
          CLINE_API_PROVIDER: openai-compatible
          CLINE_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
          CLINE_BASE_URL: ${{ secrets.AITUNNEL_BASE_URL }}
          CLINE_MODEL_ID: anthropic/claude-fable-5
        run: |
          cline --cwd . "Прочитай файл .ai_bug_report.md. Составь пошаговый безопасный план изменения кода Флаттера, который решит проблему и гарантированно НЕ сломает интерфейс и дизайн приложения. Запиши инструкции в файл .ai_fix_plan.md."

      - name: ШАГ 3 Claude Sonnet
        env:
          CLINE_API_PROVIDER: openai-compatible
          CLINE_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
          CLINE_BASE_URL: ${{ secrets.AITUNNEL_BASE_URL }}
          CLINE_MODEL_ID: anthropic/claude-3-5-sonnet
        run: |
          cline --cwd . "Изучи файлы .ai_bug_report.md и .ai_fix_plan.md. Аккуратно примени изменения к файлам в папке app/lib/ (включая tunnel_service.dart), строго следуя плану безопасности."

      - name: ШАГ 4 Claude Opus
        env:
          CLINE_API_PROVIDER: openai-compatible
          CLINE_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
          CLINE_BASE_URL: ${{ secrets.AITUNNEL_BASE_URL }}
          CLINE_MODEL_ID: anthropic/claude-3-opus
        run: |
          cline --cwd . "Внимательно изучи изменения, которые внес Claude Sonnet. Проверь код Dart на утечки памяти, баги с таймером или сессиями VPN. Если найдешь недочеты — исправь их. После завершения удали файлы .ai_bug_report.md и .ai_fix_plan.md."

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super Multi-AI Safe Fix: ${{ github.event.inputs.prompt }}" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          # Собираем универсальный стабильный релизный APK-файл под все процессоры
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: app/build/outputs/flutter-apk/*.apk
