name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        required: true

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd app
          flutter pub get

      - name: 🧠 AI Code Optimization and Bug Fix (DeepSeek-R1)
        run: |
          echo "🚀 Отправляем запрос на шлюз из твоих секретов..."
          
          # Находим и считываем текущий код файла туннеля (если он есть), чтобы передать его ИИ
          TUNNEL_CODE=""
          if [ -f "app/lib/services/tunnel_service.dart" ]; then
            TUNNEL_CODE=$(cat app/lib/services/tunnel_service.dart | jq -sR .)
          else
            TUNNEL_CODE="\"Файл tunnel_service.dart не найден, создай его с нуля с поддержкой sing-box и VLESS Reality\""
          fi

          # Чистим URL из твоих секретов от возможных лишних пробелов на конце
          CLEAN_URL=$(echo "${{ secrets.AITUNNEL_BASE_URL }}" | sed 's/[/]*$//')
          
          # Отправляем прямой запрос к модели deepseek-r1 через ТВОИ секреты
          RESPONSE=$(curl -s -X POST "$CLEAN_URL/chat/completions" \
            -H "Authorization: Bearer ${{ secrets.AITUNNEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"deepseek-r1\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"Ты элитный Android/Flutter разработчик. Твоя задача - исправить код VPN-приложения sing-box VLESS Reality, настроить DNS, маршрутизацию и починить вылеты на других телефонах (добавить foregroundServiceType в манифест). Возвращай СТРОГО только чистый код файла tunnel_service.dart без лишнего текста и без markdown-разметки (без ```dart ... ```).\"},
                {\"role\": \"user\", \"content\": \"Задача: ${{ github.event.inputs.prompt }}. Вот текущий код файла: $TUNNEL_CODE\"}
              ]
            }")

          # Извлекаем ответ нейросети из JSON
          NEW_CODE=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')

          if [ "$NEW_CODE" == "null" ] || [ -z "$NEW_CODE" ]; then
            echo "❌ Ошибка: Сервер вернул пустой ответ. Проверь баланс аккаунта или настройки секретов!"
            echo "Ответ сервера: $RESPONSE"
            exit 1
          fi

          echo "✅ Код успешно сгенерирован и оптимизирован моделью через твои секреты!"
          
          # Записываем исправленный код прямо в проект
          mkdir -p app/lib/services
          echo "$NEW_CODE" > app/lib/services/tunnel_service.dart
          
          # Автоматически добавляем поддержку фоновой службы vpn для Android 14+ в манифест
          MANIFEST_PATH="app/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<service/ s/>/ android:foregroundServiceType=\"vpn\">/' "$MANIFEST_PATH"
            echo "✅ AndroidManifest.xml успешно обновлен для поддержки Android 14+!"
          fi

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super AI Safe Fix: ${{ github.event.inputs.prompt }}" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          # Собираем универсальный стабильный релизный APK-файл под все процессоры
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: app/build/outputs/flutter-apk/*.apk
