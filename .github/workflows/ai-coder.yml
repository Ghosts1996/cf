name: Claude Fable Autonomous Builder
on:
  workflow_dispatch:
    inputs:
      task_prompt:
        description: 'Что нужно исправить или улучшить в коде?'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  ai-agent-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm i -g cline

      - name: Set up Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run Cline Agent Core
        run: |
          cline --json auth --provider openai --apikey "${{ secrets.AITUNNEL_API_KEY }}" --baseurl "${{ secrets.AITUNNEL_BASE_URL }}" --modelid anthropic/claude-fable-5 --cwd . "${{ github.event.inputs.task_prompt }}"

      - name: Commit and Push changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Claude Fable Auto-fix: ${{ github.event.inputs.task_prompt }}" || echo "No changes to commit"
          git push

      - name: Build Android APK (Auto-detect folder)
        run: |
          # Находим, в какой папке лежит gradlew
          GRADLEW_PATH=$(find . -name gradlew -print -quit)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "❌ Ошибка: Файл gradlew не найден ни в одной папке репозитория!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "✅ Проект найден в папке: $PROJECT_DIR"
          
          # Переходим в папку проекта, даем права и собираем
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-release
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
