name: Super Multi-AI Safe Builder
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Что нужно исправить или улучшить в коде?'
        required: true
      model:
        description: 'Какую модель использовать?'
        required: true
        default: 'deepseek-r1'

permissions:
  contents: write
  actions: write

jobs:
  super-ai-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          set -uo pipefail
          cd app
          flutter pub get

      - name: 🧠 AI Whole-Project Code Fix
        id: ai_optimize
        env:
          USER_PROMPT: ${{ github.event.inputs.prompt }}
          MODEL_CHOICE: ${{ github.event.inputs.model }}
          AITUNNEL_BASE_URL: ${{ secrets.AITUNNEL_BASE_URL }}
          AITUNNEL_API_KEY: ${{ secrets.AITUNNEL_API_KEY }}
        run: |
          set -uo pipefail

          trim() {
            local s="$1"
            s="${s#"${s%%[![:space:]]*}"}"
            s="${s%"${s##*[![:space:]]}"}"
            printf '%s' "$s"
          }

          PROMPT_TRIMMED="$(trim "$USER_PROMPT")"
          PROMPT_LOWER="$(printf '%s' "$PROMPT_TRIMMED" | tr '[:upper:]' '[:lower:]')"

          mapfile -t PROJECT_FILES < <(
            find . \
              \( -path './.git/*' -o -path './.github/*' -o -path '*/build/*' \
                 -o -path '*/.dart_tool/*' -o -path '*/.gradle/*' -o -path '*/Pods/*' \
                 -o -path '*/.symlinks/*' -o -path '*/generated/*' -o -path '*/.idea/*' \
                 -o -path '*/node_modules/*' \) -prune -o \
              -type f \
              ! -name '*.env' ! -name '*.env.*' \
              ! -name '*.pem' ! -name '*.key' -name '*.jks' \
              ! -name '*.keystore' ! -name '*.p12' ! -name '*.pfx' \
              ! -name 'pubspec.lock' \
              \( -name '*.dart' -o -name '*.yaml' -o -name '*.yml' \
                 -o -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.kts' \
                 -o -name '*.xml' -o -name '*.kt' -o -name '*.java' \
                 -o -name '*.plist' -o -name '*.swift' -o -name '*.py' \
                 -o -name '*.md' -o -name '*.js' -o -name '*.toml' \
                 -o -name '*.cfg' -o -name '*.ini' -o -name '*.sh' \
                 -o -name '*.css' -o -name '*.html' -o -name '*.txt' \
                 -o -name 'Dockerfile' -o -name 'Podfile' \) -print \

              | sed 's|^\./||' | sort
          )

          echo "📝 В контекст для AI попадёт файлов: ${#PROJECT_FILES[@]}"
          printf ' - %s\n' "${PROJECT_FILES[@]}"

          if [ "$PROMPT_LOWER" == "test" ]; then
            echo "test_mode=true" >> "$GITHUB_OUTPUT"
            echo "🧪 ТЕСТОВЫЙ РЕЖИМ: пропускаем вызов AI API, кредиты не тратятся."
            exit 0
          fi

          echo "test_mode=false" >> "$GITHUB_OUTPUT"

          PROJECT_BUNDLE_FILE="$RUNNER_TEMP/project_bundle.txt"
          : > "$PROJECT_BUNDLE_FILE"
          for f in "${PROJECT_FILES[@]}"; do
            {
              printf '=== FILE: %s ===\n' "$f"
              cat "$f"
              printf '\n=== END FILE ===\n\n'
            } >> "$PROJECT_BUNDLE_FILE"
          done

          BUNDLE_SIZE=$(wc -c < "$PROJECT_BUNDLE_FILE")
          echo "📦 Размер пакета с кодом: ${BUNDLE_SIZE} байт."

          SYSTEM_PROMPT="Ты старший Flutter/Android инженер, работающий с VPN-клиентом на sing-box (VLESS Reality). Тебе передан весь релевантный исходный код проекта в виде блоков. Сделай полный аудит, устрани ошибку Connection failed, адаптируй парсер под формат ключей Hiddify и добавь выбор активного профиля в меню 'Мои ключи'. Строго соблюдай совместимость, не ломай другие функции приложения. Выполни задачу ПОЛНОСТЬЮ и добросовестно."

          USER_CONTENT_FILE="$RUNNER_TEMP/user_content.txt"
          {
            printf 'Задача: %s\n\n' "$USER_PROMPT"
            printf 'Исходный код проекта:\n\n'
            cat "$PROJECT_BUNDLE_FILE"
          } > "$USER_CONTENT_FILE"

          CLEAN_URL="${AITUNNEL_BASE_URL%/}"
          PAYLOAD_FILE="$RUNNER_TEMP/payload.json"

          jq -n \
            --arg model "$MODEL_CHOICE" \
            --arg sys "$SYSTEM_PROMPT" \
            --rawfile usr "$USER_CONTENT_FILE" \
            --argjson max_tokens 32000 \
            '{model: $model, messages: [{role: "system", content: $sys}, {role: "user", content: $usr}], max_tokens: $max_tokens}' \
            > "$PAYLOAD_FILE"

          RESPONSE_FILE="$RUNNER_TEMP/response.json"
          
          HTTP_CODE=$(curl -sS --max-time 600 --retry 2 --retry-delay 5 -X POST "$CLEAN_URL/chat/completions" \
            -H "Authorization: Bearer $AITUNNEL_API_KEY" \
            -H "Content-Type: application/json" \
            -d @"$PAYLOAD_FILE" \
            -o "$RESPONSE_FILE" \
            -w '%{http_code}')

          CURL_STATUS=$?

          if [ "$CURL_STATUS" -ne 0 ]; then
            echo "❌ Ошибка сети при обращении к AITUNNEL (curl exit code $CURL_STATUS)."
            exit 1
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "❌ Сервер вернул ошибку HTTP $HTTP_CODE"
            cat "$RESPONSE_FILE"
            exit 1
          fi

          echo "✅ Запрос к API выполнен успешно! Переходим к разбору ответа..."

      - name: Push Code Changes
        continue-on-error: true
        run: |
          git config --global user.name "AITUNNEL-Bot"
          git config --global user.email "bot@aitunnel.ru"
          git add .
          git commit -m "Super AI Safe Fix: VLESS Reality & MethodChannel" || echo "No changes to commit"
          git push

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-package
          path: app/build/outputs/flutter-apk/*.apk
