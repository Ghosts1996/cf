name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix/secure-configs-and-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter Windows app
    # [НОВОЕ] В отличие от build-android.yml (ubuntu-latest) — сборка под
    # Windows обязана идти на windows-раннере: `flutter build windows`
    # использует MSBuild/Visual Studio Build Tools, которых на Linux нет
    # физически, это не вопрос настройки, а требование самого Flutter.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    # [ИСПРАВЛЕНО — реальный баг образа windows-latest] По умолчанию
    # PUB_CACHE = C:\Users\runneradmin\.pub-cache. На раннерах GitHub
    # Windows Defender/индексатор папок успевает положить служебный файл
    # (например desktop.ini) в только что созданную ПУСТУЮ временную папку
    # `_temp\dirXXXXXXXX` ещё до того, как `git clone --mirror` успевает
    # туда что-то склонировать — поэтому git видит "already exists and is
    # not empty" даже на самой первой попытке, с новым случайным именем
    # папки каждый раз (это видно в логе: dir9e93c3d2, dir57e286f1,
    # dir347b6388 — разные имена, но одна и та же ошибка). Дело не в
    # "мусоре от прошлой попытки" (то есть предыдущий фикс с очисткой
    # `_temp` не помогал по сути) — реальная причина в самой папке
    # C:\Users\runneradmin\.pub-cache на этом образе раннера. Стандартное
    # решение сообщества Dart/Flutter — увести PUB_CACHE на диск D:
    # (на GitHub-раннерах Windows это отдельный более быстрый диск, где
    # Defender/индексатор так не ведёт себя с новыми папками).
    env:
      PUB_CACHE: D:\pubcache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (official)
        uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      # Создаём кастомную папку под PUB_CACHE на D: заранее — так же, как
      # это неявно делает pub при первом обращении, но явно и без сюрпризов.
      - name: "Prepare custom PUB_CACHE on D:"
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "$env:PUB_CACHE" | Out-Null

      # [ИСПРАВЛЕНО — реальный баг образа windows-latest, см. комментарий
      # у `env: PUB_CACHE` выше] Сама git-зависимость (flutter_singbox_client,
      # github.com/Ghosts1996/cf.git, ветка ccurecc_singbox_dns) рабочая —
      # build-android.yml тянет тот же пакет 152 раза без единого сбоя на
      # ubuntu-latest. Проблема была в системной папке
      # C:\Users\runneradmin\.pub-cache на Windows-образе раннера, а не в
      # логике pub get — перенос PUB_CACHE на D: (шаг выше) устраняет
      # причину напрямую. Retry оставляем как страховку на случай обычного
      # сетевого сбоя при клонировании — на реальную причину бага он не
      # влияет, но не мешает.
      - name: Flutter pub get
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: cd app; flutter pub get

      # Та же генерация фирменной иконки, что и в build-android.yml — иначе
      # .exe соберётся со стандартной иконкой Flutter вместо иконки VPNonLine
      # (flutter_launcher_icons в pubspec.yaml уже настроен и на windows: true).
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

      # [ВАЖНО] Тот же секрет SHOPBOT_API_KEY, что и в Android-сборке —
      # единый ключ бэкенда для всех платформ клиента.
      - name: Build Windows release
        run: flutter build windows --release --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}

      # [ВАЖНО] Предупреждение прямо в логе сборки, если windows/sing-box/
      # пустая — тогда .exe соберётся нормально, но реальный VPN на Windows
      # заработает только через автозагрузку sing-box.exe/wintun.dll при
      # первом подключении клиента (см. singbox_runtime_windows.dart), а не
      # "из коробки" сразу после установки — это ожидаемо, не ошибка сборки.
      - name: Check bundled sing-box binaries
        shell: bash
        run: |
          if [ ! -f "windows/sing-box/sing-box.exe" ] || [ ! -f "windows/sing-box/wintun.dll" ]; then
            echo "::warning::windows/sing-box/ не содержит sing-box.exe и/или wintun.dll — приложение соберётся, но при первом подключении само скачает их у клиента (нужен интернет). Чтобы зашить файлы прямо в сборку — положи их в windows/sing-box/ перед пушем."
          else
            echo "sing-box.exe и wintun.dll найдены — будут зашиты прямо в сборку."
          fi

      # [НОВОЕ] flutter build windows кладёт готовый .exe + все .dll в
      # build/windows/x64/runner/Release — упаковываем это целиком в один
      # zip, чтобы результат можно было просто распаковать на любом
      # Windows-компьютере и запустить, без отдельной установки.
      - name: Zip Release folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "VPNonLine-windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: vpnonline-windows
          path: app/VPNonLine-windows.zip