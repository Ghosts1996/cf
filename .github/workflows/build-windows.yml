name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix/secure-configs-and-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter Windows app
    # [НОВОЕ] В отличие от build-android.yml (ubuntu-latest) — сборка под
    # Windows обязана идти на windows-раннере: `flutter build windows`
    # использует MSBuild/Visual Studio Build Tools, которых на Linux нет
    # физически, это не вопрос настройки, а требование самого Flutter.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    # [ИСПРАВЛЕНО — реальный баг образа windows-latest] По умолчанию
    # PUB_CACHE = C:\Users\runneradmin\.pub-cache. На раннерах GitHub
    # Windows Defender/индексатор папок успевает положить служебный файл
    # (например desktop.ini) в только что созданную ПУСТУЮ временную папку
    # `_temp\dirXXXXXXXX` ещё до того, как `git clone --mirror` успевает
    # туда что-то склонировать — поэтому git видит "already exists and is
    # not empty" даже на самой первой попытке, с новым случайным именем
    # папки каждый раз (это видно в логе: dir9e93c3d2, dir57e286f1,
    # dir347b6388, dir2fdd8578, dir9198d584, dir895fc61f — разные имена,
    # одна и та же ошибка). Дело не в "мусоре от прошлой попытки" —
    # реальная причина в самой папке C:\Users\runneradmin\.pub-cache на
    # этом образе раннера.
    #
    # [ИСПРАВЛЕНО #2 — почему просто `env: PUB_CACHE: D:\...` на уровне job
    # не сработал] Лог показал, что PUB_CACHE всё равно оставался
    # `/c/Users/runneradmin/.pub-cache`, несмотря на job-level env. Причина:
    # `flutter-actions/setup-flutter@v2` сам прописывает PUB_CACHE через
    # файл GITHUB_ENV (стандартный способ setup-экшенов задавать переменные
    # для последующих шагов) — а такая запись выполняется ПОЗЖЕ, чем
    # применяется job-level `env:`, и поэтому перебивает его для всех шагов
    # после Setup Flutter. Поэтому переопределяем PUB_CACHE не через job
    # `env:`, а отдельным шагом СРАЗУ ПОСЛЕ Setup Flutter — тем же
    # механизмом GITHUB_ENV, только последним, значит именно он и победит.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (official)
        uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      # [ИСПРАВЛЕНО #2] Переопределяем PUB_CACHE ПОСЛЕ Setup Flutter (он
      # сам молча прописывает свой PUB_CACHE через GITHUB_ENV, поэтому
      # переопределение ДО этого шага не срабатывает — см. комментарий
      # выше). Диск D: на GitHub Windows-раннерах отдельный от системного
      # C:, там не проявляется баг с "already exists and is not empty".
      - name: Move PUB_CACHE to D drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\pubcache" | Out-Null
          "PUB_CACHE=D:\pubcache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PUB_CACHE overridden to D:\pubcache for all subsequent steps"

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      # Сама git-зависимость (flutter_singbox_client, github.com/Ghosts1996/
      # cf.git, ветка ccurecc_singbox_dns) рабочая — build-android.yml тянет
      # тот же пакет 152 раза без единого сбоя на ubuntu-latest. Проблема
      # была в системной папке C:\Users\runneradmin\.pub-cache на
      # Windows-образе раннера, а не в логике pub get — перенос PUB_CACHE
      # на D: (шаг выше) устраняет причину напрямую. Retry оставляем как
      # страховку на случай обычного сетевого сбоя при клонировании — на
      # реальную причину бага он не влияет, но не мешает.
      - name: Flutter pub get
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: cd app; flutter pub get

      # Та же генерация фирменной иконки, что и в build-android.yml — иначе
      # .exe соберётся со стандартной иконкой Flutter вместо иконки VPNonLine
      # (flutter_launcher_icons в pubspec.yaml уже настроен и на windows: true).
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

      # [ИСПРАВЛЕНО — тот же класс бага, что и с pub get выше, но на другом
      # инструменте] `LNK1327: failure during running mt.exe` — известная
      # проблема Windows-раннеров GitHub Actions: Windows Defender
      # real-time protection на долю секунды блокирует свежесозданный .exe
      # сразу после линковки, пока mt.exe пытается встроить в него манифест
      # — тот же паттерн блокировки файлов антивирусом, что был с
      # `git clone` у pub get (см. выше), только теперь на linker/mt.exe.
      # Исключаем папку сборки из реального времени сканирования Defender
      # заранее — GitHub-раннеры выполняются с правами администратора,
      # Add-MpPreference доступен без дополнительных прав.
      - name: Exclude build folder from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "mt.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions added for ${{ github.workspace }}, mt.exe, link.exe"

      # [ВАЖНО] Тот же секрет SHOPBOT_API_KEY, что и в Android-сборке —
      # единый ключ бэкенда для всех платформ клиента.
      # Оборачиваем в retry как страховку: даже если исключение Defender
      # выше почему-то не успело подхватиться (например, из-за задержки
      # применения политики защитника), повторная попытка мимо того же
      # временного файлового лока обычно проходит.
      - name: Build Windows release
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: cd app; flutter build windows --release --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}

      # [ВАЖНО] Предупреждение прямо в логе сборки, если windows/sing-box/
      # пустая — тогда .exe соберётся нормально, но реальный VPN на Windows
      # заработает только через автозагрузку sing-box.exe/wintun.dll при
      # первом подключении клиента (см. singbox_runtime_windows.dart), а не
      # "из коробки" сразу после установки — это ожидаемо, не ошибка сборки.
      - name: Check bundled sing-box binaries
        shell: bash
        run: |
          if [ ! -f "windows/sing-box/sing-box.exe" ] || [ ! -f "windows/sing-box/wintun.dll" ]; then
            echo "::warning::windows/sing-box/ не содержит sing-box.exe и/или wintun.dll — приложение соберётся, но при первом подключении само скачает их у клиента (нужен интернет). Чтобы зашить файлы прямо в сборку — положи их в windows/sing-box/ перед пушем."
          else
            echo "sing-box.exe и wintun.dll найдены — будут зашиты прямо в сборку."
          fi

      # [НОВОЕ] flutter build windows кладёт готовый .exe + все .dll в
      # build/windows/x64/runner/Release — упаковываем это целиком в один
      # zip, чтобы результат можно было просто распаковать на любом
      # Windows-компьютере и запустить, без отдельной установки.
      - name: Zip Release folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "VPNonLine-windows.zip" -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: vpnonline-windows
          path: app/VPNonLine-windows.zip