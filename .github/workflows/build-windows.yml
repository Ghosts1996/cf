name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master, fix/secure-configs-and-ci ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Flutter Windows app
    # Сборка под Windows идёт только на windows-раннере: `flutter build windows`
    # использует MSBuild и Visual Studio Build Tools.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    # PUB_CACHE по умолчанию лежит в C:\Users\runneradmin\.pub-cache, и на
    # этом образе раннера `git clone --mirror` стабильно падает там с
    # "already exists and is not empty": в свежесозданную пустую временную
    # папку успевает попасть служебный файл (например desktop.ini) до того,
    # как git начнёт клонировать.
    #
    # Job-level `env:` эту переменную не перебивает: setup-flutter прописывает
    # свой PUB_CACHE через GITHUB_ENV уже после того, как job-level env
    # применён. Поэтому переопределяем отдельным шагом сразу после Setup
    # Flutter — тем же механизмом, но последними.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Приложение — VPN-клиент, и Defender может отправить свежесобранный .exe
      # в карантин прямо между link.exe и mt.exe: отсюда "failure during running
      # mt.exe" — mt.exe открывает файл, которого уже нет. Точечное исключение
      # через Add-MpPreference может тихо не сработать, поэтому отключаем
      # real-time protection целиком в начале job.
      - name: Disable Windows Defender real-time protection
        shell: pwsh
        run: |
          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IoavProtectionEnabled, BehaviorMonitorEnabled

      - name: Setup Flutter (official)
        uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      # Переопределяем PUB_CACHE после Setup Flutter — он сам прописывает свой
      # через GITHUB_ENV, и переопределение до этого шага не срабатывает. Диск D:
      # на Windows-раннерах отдельный от системного C:, там нет проблемы с
      # "already exists and is not empty".
      - name: Move PUB_CACHE to D drive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "D:\pubcache" | Out-Null
          "PUB_CACHE=D:\pubcache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PUB_CACHE overridden to D:\pubcache for all subsequent steps"

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      # Сама git-зависимость (flutter_singbox_client) рабочая — build-android.yml
      # тянет тот же пакет без сбоев. Проблема была в системной папке
      # .pub-cache на Windows-образе, и перенос PUB_CACHE на D: устраняет её
      # напрямую. Retry остаётся страховкой на случай обычного сетевого сбоя.
      - name: Flutter pub get
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: cd app; flutter pub get

      # Та же генерация фирменной иконки, что и в build-android.yml — иначе
      # .exe соберётся со стандартной иконкой Flutter вместо иконки VPNonLine
      # (flutter_launcher_icons в pubspec.yaml уже настроен и на windows: true).
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Flutter analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test --coverage
        continue-on-error: true

      # LNK1327 здесь вызывает гонка процессов MSBuild: CMake-проект Flutter
      # собирает параллельно несколько целей (.exe плюс плагины), и несколько
      # worker-узлов могут одновременно писать во временный файл манифеста —
      # известная проблема параллельных Windows-сборок на CI. Исключение из
      # Defender не мешает, но реальный фикс ниже.
      - name: Exclude build folder from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "mt.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe" -ErrorAction SilentlyContinue
          Write-Host "Defender exclusions added for ${{ github.workspace }}, mt.exe, link.exe"

      # MSBUILDDISABLENODEREUSE=1 запрещает переиспользовать worker-процессы
      # MSBuild между вызовами: это убирает гонку файловых блокировок, вызывающую
      # LNK1327 на mt.exe. Внутри каждой попытки сначала идёт `flutter clean` —
      # иначе повторная попытка бьётся об испорченные промежуточные файлы
      # предыдущей и падает за считанные секунды вместо полной пересборки.
      #
      # `-v` оставлен намеренно: без детального вывода MSBuild видна только
      # финальная сводка линкера, без настоящей команды mt.exe и текста её
      # ошибки. Попытка одна — три одинаковых лога времени раннера не стоят.
      - name: Build Windows release (verbose diagnostic)
        shell: pwsh
        env:
          MSBUILDDISABLENODEREUSE: "1"
        run: |
          flutter clean
          flutter pub get
          flutter build windows --release -v --dart-define=SHOPBOT_API_KEY=${{ secrets.SHOPBOT_API_KEY }}

      # Предупреждение в лог, если windows/sing-box/ пустая: .exe соберётся
      # нормально, но sing-box.exe и wintun.dll клиент тогда скачает сам при
      # первом подключении (см. singbox_runtime_windows.dart), а не получит
      # сразу после установки.
      - name: Check bundled sing-box binaries
        shell: bash
        run: |
          if [ ! -f "windows/sing-box/sing-box.exe" ] || [ ! -f "windows/sing-box/wintun.dll" ]; then
            echo "::warning::windows/sing-box/ не содержит sing-box.exe и/или wintun.dll — приложение соберётся, но при первом подключении само скачает их у клиента (нужен интернет). Чтобы зашить файлы прямо в сборку — положи их в windows/sing-box/ перед пушем."
          else
            echo "sing-box.exe и wintun.dll найдены — будут зашиты прямо в сборку."
          fi

      # Собираем установщик через Inno Setup (windows/installer/installer.iss):
      # один .exe, который ставит приложение в Program Files и создаёт ярлыки,
      # вместо zip-архива с папкой, из которой нужно запускать вручную.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer\installer.iss"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vpnonline-windows-installer
          path: installer-output/VPNonLine-Setup.exe