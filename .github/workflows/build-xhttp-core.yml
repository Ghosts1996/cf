name: Build sing-box core with XHTTP

# Собирает libbox.aar из форка hiddify/hiddify-sing-box — того самого ядра,
# на котором работает Hiddify и которое, в отличие от апстримного sing-box,
# понимает транспорт XHTTP (он же splithttp).
#
# Запускается только вручную: штатную сборку приложения этот workflow не
# трогает и ядро в репозитории сам по себе не меняет. Результат — артефакт
# libbox.aar, который нужно положить в ветку плагина (см. app/XHTTP_CORE.md).

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'Коммит, ветка или тег hiddify/hiddify-sing-box'
        required: true
        default: 'dd10a2129de7'
      go_version:
        description: 'Версия Go (должна быть не ниже указанной в go.mod ядра)'
        required: true
        default: '1.24.7'

jobs:
  build:
    name: gomobile bind ./experimental/libbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}

      # build_libbox из ядра проверяет версию java и отказывается работать,
      # если это не openjdk 17.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clone core
        run: |
          git clone https://github.com/hiddify/hiddify-sing-box.git core
          cd core
          git checkout "${{ inputs.core_ref }}"
          echo "Ядро: $(git rev-parse HEAD)"
          grep -n 'V2RayTransportTypeXHTTP' constant/v2ray.go \
            || { echo "::error::в этой ревизии ядра нет XHTTP"; exit 1; }

      # Тот же способ, которым ядро собирает себя само (Makefile -> lib_android):
      # gomobile bind по ./experimental/libbox с пакетом io.nekohasekai.
      # Именно поэтому собранный .aar совместим с плагином flutter_singbox_client.
      - name: Install gomobile
        run: |
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.11

      - name: Build libbox.aar
        working-directory: core
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android
          ls -la libbox*.aar

      - name: Upload core
        uses: actions/upload-artifact@v4
        with:
          name: libbox-xhttp-${{ inputs.core_ref }}
          path: |
            core/libbox.aar
            core/libbox-legacy.aar
          if-no-files-found: error
          retention-days: 30
